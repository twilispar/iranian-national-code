[project]
name = "iranian-national-code"
version = "1.1.0"
description = "Validate and generate Iranian National Codes (کد ملی) — dependency-free."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Twili" }
]
keywords = ["iran", "national-code", "codemelli", "validator", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/twilispar/iranian-national-code"
Repository = "https://github.com/twilispar/iranian-national-code"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iranian_national_code"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "build>=1.0",
    "twine>=5.0",
]
